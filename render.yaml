services:
  - type: worker
    name: promo-monitor
    env: node
    region: oregon
    plan: free
    buildCommand: npm install
    startCommand: node monitor.js
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: API_ID
        sync: false
      - key: API_HASH
        sync: false
      - key: SELFBOT_SESSION
        sync: false